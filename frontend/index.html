<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Planillas COF Web
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<style>


body{

    min-height:100vh;

    background:#eef3f8;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

}



/* ENCABEZADO */

.header{

    background:
    linear-gradient(
        135deg,
        #002f5f,
        #0072bc
    );

    color:white;

    padding:25px 0;

    box-shadow:
    0 5px 20px rgba(0,0,0,.25);

}



.logo{

    height:80px;
    width:auto;

}



.titulo{

    font-size:32px;

    font-weight:700;

}



.subtitulo{

    font-size:17px;

    opacity:.9;

}





/* TARJETA */

.card-panel{

    margin-top:40px;

    border:none;

    border-radius:22px;

    box-shadow:

    0 10px 30px rgba(0,0,0,.12);

}





.card-panel h3{

    color:#003b73;

    font-weight:700;

}





/* BOTON */


.btn-generar{

    background:#0066a8;

    border:none;

    border-radius:14px;

    padding:14px;

    font-size:18px;

}



.btn-generar:hover{

    background:#004d80;

}



.btn-generar:disabled{

    opacity:.7;

}





/* RESULTADOS */


.resultado{

    display:none;

    margin-top:30px;

}



.generando{

    text-align:center;

    padding:35px;

    border-radius:18px;

}





.item-resumen{


    display:flex;

    justify-content:space-between;

    padding:10px;

    font-size:18px;


}



.total{


    font-size:25px;

    font-weight:700;

}



</style>


</head>


<body>



<div class="header">


<div class="container">


<div class="d-flex align-items-center">


<img

src="/static/img/logo_metropol.png"

class="logo me-4"


>


<div>


<div class="titulo">

Planillas COF Web

</div>


<div class="subtitulo">

Generador de Planillas Operacionales

</div>


</div>


</div>


</div>


</div>
<div class="container">


<div class="card card-panel">


<div class="card-body p-4">


<h3 class="mb-4">

<i class="bi bi-file-earmark-excel"></i>

Generar Planillas

</h3>



<form id="formulario">



<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Unidad

</label>


<select

id="unidad"

name="unidad"

class="form-select"

required>


<option value="">

Seleccione

</option>


</select>


</div>




<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Servicio

</label>


<select

id="servicio"

name="servicio"

class="form-select"

required>


<option value="">

Seleccione

</option>


</select>


</div>



</div>



<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Tipo de Día

</label>


<select

id="tipo_dia"

name="tipo_dia"

class="form-select">



<option value="Laboral">

Laboral

</option>



<option value="Sabado">

Sabado

</option>



<option value="Domingo">

Domingo

</option>



<option value="TODO">

TODO

</option>


</select>


</div>





<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Archivos FUS

</label>


<input

type="file"

id="archivos"

name="archivos"

multiple

accept=".xlsx"

class="form-control"

required>


</div>


</div>






<button

type="submit"

id="btnGenerar"

class="btn btn-primary w-100 btn-generar"

>


<i class="bi bi-gear"></i>

Generar Planillas


</button>




</form>





<div

id="resultado"

class="resultado">


</div>





</div>


</div>


</div>









<script>


const unidad =

document.getElementById("unidad");



const servicio =

document.getElementById("servicio");



const formulario =

document.getElementById("formulario");



const resultado =

document.getElementById("resultado");



const boton =

document.getElementById("btnGenerar");






// ============================
// FORMATO TIEMPO
// ============================


function formatoTiempo(segundos){


let horas = Math.floor(segundos / 3600);


let minutos = Math.floor(
    (segundos % 3600) / 60
);


let segundosFinal = Math.floor(
    segundos % 60
);



let texto = "";



if(horas > 0){

    texto += horas + " hora ";

}



if(minutos > 0){

    texto += minutos + " minutos ";

}



texto += segundosFinal + " segundos";



return texto;


}






// ============================
// CARGAR UNIDADES
// ============================


fetch("/api/unidades")


.then(res => res.json())


.then(data => {


data.unidades.forEach(u => {



unidad.innerHTML +=


`

<option value="${u}">

${u}

</option>

`;



});



});
// ============================
// CAMBIO UNIDAD
// ============================


unidad.addEventListener(

"change",

()=>{


servicio.innerHTML =


`

<option value="TODO">

TODO

</option>

`;



fetch(

"/api/servicios/" +

unidad.value

)



.then(res => res.json())


.then(data => {


data.servicios.forEach(s=>{


servicio.innerHTML +=


`

<option value="${s}">

${s}

</option>

`;


});



});


});






// ============================
// GENERAR
// ============================


formulario.addEventListener(

"submit",

async(e)=>{


e.preventDefault();



boton.disabled = true;



boton.innerHTML =


`

<span class="spinner-border spinner-border-sm"></span>

Generando planillas...

`;



resultado.style.display="block";



resultado.innerHTML =


`

<div class="alert alert-info generando">


<div class="spinner-border text-primary mb-3">

</div>


<h4>

⏳ Generando planillas

</h4>


<p>

Por favor espere...

</p>


<p>

No actualice ni cierre esta ventana.

</p>


</div>

`;





let datos = new FormData(formulario);



try{


let respuesta = await fetch(

"/generar",

{

method:"POST",

body:datos

}

);




let data = await respuesta.json();



if(data.ok){



resultado.innerHTML =


`

<div class="alert alert-success">


<h4>

<i class="bi bi-check-circle"></i>

Proceso terminado correctamente

</h4>


<hr>



<div class="item-resumen">

<span>

🟦 Laboral

</span>


<b>

${data.laboral}

</b>


</div>




<div class="item-resumen">

<span>

🟨 Sabado

</span>


<b>

${data.sabado}

</b>


</div>




<div class="item-resumen">

<span>

🟩 Domingo

</span>


<b>

${data.domingo}

</b>


</div>




<hr>



<div class="item-resumen total">


<span>

TOTAL

</span>


<b>

${data.total}

</b>


</div>




<hr>



<p>

⏱ Tiempo de proceso:

<b>

${formatoTiempo(data.tiempo)}

</b>


</p>



<hr>



<div class="d-grid">


<a

href="/descargar/${data.zip}"

class="btn btn-success btn-lg"

download

onclick="limpiarFormulario()"

>


<i class="bi bi-download"></i>


Descargar ${data.zip}


</a>


</div>



</div>


`;



}

else{


resultado.innerHTML =


`

<div class="alert alert-danger">


<h5>

❌ Error al generar

</h5>


<p>

${data.error}

</p>


</div>


`;



}



}


catch(error){



resultado.innerHTML =


`

<div class="alert alert-danger">


<h5>

❌ Error de conexión

</h5>


<p>

${error}

</p>


</div>


`;



}



finally{



boton.disabled = false;



boton.innerHTML =


`

<i class="bi bi-gear"></i>

Generar Planillas

`;





setTimeout(()=>{



formulario.reset();



servicio.innerHTML =


`

<option value="">

Seleccione

</option>

`;



unidad.value = "";



},10000);



}



});


function limpiarFormulario(){

    setTimeout(()=>{

        formulario.reset();


        servicio.innerHTML =

        `
        <option value="">
        Seleccione
        </option>
        `;


        unidad.value = "";


        resultado.style.display = "none";


        resultado.innerHTML = "";


    },10000);

}



</script>



</body>


</html>
